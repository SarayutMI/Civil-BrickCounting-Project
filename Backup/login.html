<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบ — CIVIL</title>
<style>
  :root{
    --bg:#f5f5f7;--panel:#fff;--text:#1d1d1f;--muted:#6e6e73;
    --divider:#e8e8ed;--accent:#0071e3;--danger:#c62828;--radius:16px;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-size:14px;display:grid;place-items:center}
  .card{width:360px;max-width:90vw;background:var(--panel);border:1px solid var(--divider);border-radius:var(--radius);padding:32px 28px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
  .brand{text-align:center;margin-bottom:22px}
  .brand strong{font-size:22px;letter-spacing:-.5px;display:block}
  .brand small{color:var(--muted)}
  .form-group{margin-bottom:14px}
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
  input{width:100%;padding:10px 12px;border:1px solid var(--divider);border-radius:10px;font:inherit;background:#fff}
  input:focus{outline:2px solid var(--accent);outline-offset:1px}
  button{width:100%;padding:11px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer;margin-top:6px}
  button:disabled{opacity:.6;cursor:default}
  .err{color:var(--danger);font-size:12.5px;margin-top:10px;min-height:16px}
  .hint{margin-top:18px;padding-top:16px;border-top:1px solid var(--divider);font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <div class="brand"><strong>CIVIL</strong><small>AI Brick Construction Monitoring</small></div>
    <div class="form-group"><label>Username</label><input id="username" autocomplete="username" autofocus></div>
    <div class="form-group"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
    <button id="loginBtn" type="submit">เข้าสู่ระบบ</button>
    <div class="err" id="loginErr"></div>
    <div class="hint">Mockup — ทดลองใช้ user: <strong>admin</strong> / pass: <strong>password</strong></div>
  </form>
<script>
  // ถ้ามี session อยู่แล้ว ข้ามหน้า login ไปเลย
  if(localStorage.getItem('civil_user')){ location.href = './index.html'; }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('loginErr');
    err.textContent = '';
    if(!username || !password){ err.textContent = 'กรุณากรอก username และ password'; return; }
    btn.disabled = true; btn.textContent = 'กำลังเข้าสู่ระบบ...';
    try{
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if(res.ok && data.success){
        localStorage.setItem('civil_user', JSON.stringify(data.user));
        location.href = './index.html';
      } else {
        err.textContent = data.message || 'เข้าสู่ระบบไม่สำเร็จ';
      }
    }catch(_){
      err.textContent = 'เชื่อมต่อ backend ไม่สำเร็จ — ตรวจสอบว่ารัน server.js อยู่หรือไม่';
    }finally{
      btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
    }
  });
</script>
</body>
</html>
